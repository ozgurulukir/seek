format: 1
name: zed
description: Zed Agent panel thread'leri (zstd JSON blob)

sources:
  - driver: sqlite
    when: { file_exists: "~/.local/share/zed/threads/threads.db" }
    paths: ["~/.local/share/zed/threads/threads.db"]
    versions:
      - version: 1
        sessions:
          query: |
            SELECT id, summary, updated_at, data, folder_paths, parent_id FROM threads
          id: id
          title: summary
          cursor: updated_at
          cursor_format: rfc3339
          data: data
          metadata:
            workspace: folder_paths
            parent: parent_id
        messages:
          inline: true
          decode: zstd
          items: messages
          variants:
            - match_key: User
              role: user
              array_field: content
              text_keys: [Text]
            - match_key: Agent
              role: assistant
              array_field: content
              text_keys: [Text, "Thinking.text"]
