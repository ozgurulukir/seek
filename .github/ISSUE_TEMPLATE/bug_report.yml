name: Bug report
description: Report a bug in seek
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please fill in as much as you can.
  - type: input
    id: version
    attributes:
      label: seek version
      description: Output of `seek --version`
      placeholder: "v0.6.2"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture
      placeholder: "Linux amd64"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      render: shell