name: test
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=1 go build -tags fts5 -o /dev/null .
      - name: Test
        run: CGO_ENABLED=1 go test -tags fts5 ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet ./...
      - name: Gofmt
        run: test -z "$(gofmt -l cmd internal main.go)"
