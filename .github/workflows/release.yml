name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Manual dispatch has no v* ref, so the version must be supplied explicitly.
    # It defaults to a draft/pre-release so a dispatch can never publish a
    # public release with a dev binary. A normal v* tag push is unaffected.
    inputs:
      version:
        description: 'Version/tag to build and draft (e.g. v1.2.3); tag pushes derive it from the ref'
        type: string
        required: true
      draft:
        description: 'Create a draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Quality gate: the same checks as test.yml must pass on the tagged commit
  # before any release artifact is built or published. A red test run must
  # never ship (v0.2.8 regression: publish only depended on build). Keep this
  # job in lockstep with test.yml (build, test, vet, govulncheck, gofmt,
  # stale-command check).
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: CGO_ENABLED=1 go build -tags "fts5 sqlite_fts5" -o /dev/null .
      - name: Test
        run: CGO_ENABLED=1 go test -tags "fts5 sqlite_fts5" ./...
      - name: Vet
        run: CGO_ENABLED=1 go vet -tags "fts5 sqlite_fts5" ./...
      - name: Vulnerability scan
        env:
          # Pin the scan to the same toolchain the module's toolchain
          # directive names, so the govulncheck binary and the go toolchain
          # it drives cannot skew (a 1.25-built binary driving a 1.27
          # toolchain mis-compiles the newer standard library).
          GOTOOLCHAIN: go1.27.4
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Gofmt
        run: test -z "$(gofmt -l cmd internal main.go third_party)"
      - name: Stale command check
        run: bash scripts/check-stale-commands.sh

  build:
    needs: test
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      # Tag push: derive from the ref (e.g. v1.2.3). Manual dispatch: use the
      # requested version so the binary, archive, and release tag agree.
      VERSION: ${{ inputs.version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            artifact_name: linux-amd64
            archive_ext: tar.gz

          # macOS Apple Silicon (ARM64)
          - os: darwin
            arch: arm64
            runner: macos-latest
            artifact_name: darwin-arm64
            archive_ext: tar.gz

          # Windows x86_64
          - os: windows
            arch: amd64
            runner: windows-latest
            artifact_name: windows-amd64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure MinGW on Windows
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Select MinGW compiler
        if: matrix.os == 'windows'
        shell: bash
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"

      - name: Verify Windows CGO toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          go clean -cache
          go env GOOS GOARCH CGO_ENABLED CC CXX
          gcc --version | Select-Object -First 1

      - name: Validate dispatched version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          # A manual dispatch has no v* ref to constrain the version, and it
          # flows into ldflags, archive names and tag_name. Reject anything
          # that is not a semver before building or publishing.
          if ! printf '%s' "${VERSION}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Manual dispatch requires a semver version (X.Y.Z or vX.Y.Z); got '${VERSION}'" >&2
            exit 1
          fi

      - name: Build binary
        shell: bash
        run: |
          VERSION="${VERSION:-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          COMMIT="$(git rev-parse --short HEAD)"

          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          mkdir -p bin
          CGO_ENABLED=1 go build -tags "fts5 sqlite_fts5" \
            -ldflags="-s -w -X github.com/ozgurulukir/seek/internal/buildinfo.Version=${VERSION} -X github.com/ozgurulukir/seek/internal/buildinfo.Commit=${COMMIT}" \
            -o "bin/seek${EXT}" .

      - name: Smoke test binary (FTS5 runtime)
        shell: bash
        run: |
          # Keep the smoke test completely isolated from runner/user config.
          # `status` opens the SQLite store, so this fails if the produced
          # artifact was compiled without SQLite FTS5.
          SMOKE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          if [ "${{ matrix.os }}" = "windows" ]; then
            export APPDATA="$SMOKE_ROOT/AppData/Roaming"
            export LOCALAPPDATA="$SMOKE_ROOT/AppData/Local"
            mkdir -p "$APPDATA" "$LOCALAPPDATA"
            bin/seek.exe status
          else
            export XDG_CONFIG_HOME="$SMOKE_ROOT/config"
            export XDG_CACHE_HOME="$SMOKE_ROOT/cache"
            mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
            bin/seek status
          fi

      - name: Package release archive
        shell: bash
        run: |
          VERSION="${VERSION:-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi

          PKG_NAME="seek_${VERSION}_${{ matrix.artifact_name }}"
          mkdir -p "dist/${PKG_NAME}"

          # Include documentation in package
          cp README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cp ATTRIBUTION.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cp LICENSE "dist/${PKG_NAME}/" 2>/dev/null || true

          if [ "${{ matrix.os }}" = "windows" ]; then
            cp bin/seek.exe "dist/${PKG_NAME}/"
            (cd dist && 7z a "${PKG_NAME}.zip" "${PKG_NAME}")
          else
            cp bin/seek "dist/${PKG_NAME}/"
            (cd dist && tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}")
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [test, build]
    runs-on: ubuntu-latest
    # A v* tag push publishes exactly as before. Manual dispatch may only
    # produce a draft (default), never a public release with a dev binary.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            release_assets/*
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
